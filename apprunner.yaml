version: 1.0
runtime: python3
build:
  commands:
    build:
      - pip3 install --upgrade pip
      - pip3 install -r requirements.txt
run:
  command: gunicorn --bind 0.0.0.0:8000 --workers 1 --threads 8 --timeout 120 --access-logfile - --error-logfile - app:app
  network:
    port: 8000
  env:
    - name: PORT
      value: "8000"
